name: Build desktop image

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/build-desktop.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bootsybox-desktop:44
